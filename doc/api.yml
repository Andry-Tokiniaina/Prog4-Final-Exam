openapi: 3.0.3
info:
  title: HEI School Exam API
  version: 1.0.0
  description: OpenAPI specification adapted to the uploaded HEI School Exam Spring
    Boot project. Authentication is stateless JWT; x-required-roles reflects the project's
    @PreAuthorize annotations.
servers:
  - url: https://your-app-preprod.poja.io
    description: Preprod
  - url: https://your-app.poja.io
    description: Prod
tags:
  - name: Students
  - name: Teachers
  - name: Tracks
  - name: Semesters
  - name: Courses
  - name: Exams
  - name: Groups
  - name: Grades
  - name: Cohorts
  - name: Transcripts
security:
  - bearerAuth: []
paths:
  /students/me:
    get:
      tags:
        - Students
      summary: Get the current student's profile
      description: 'Required role: STUDENT'
      responses:
        '200':
          description: Student profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
      x-required-roles:
        - STUDENT
      security:
        - bearerAuth: []
  /students/me/grades:
    get:
      tags:
        - Grades
      summary: View MY grades
      description: 'Required role: STUDENT. A student can only view their own grades.'
      responses:
        '200':
          description: List of the current student's grades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Grade'
      x-required-roles:
        - STUDENT
      security:
        - bearerAuth: []
  /students/me/transcript:
    post:
      tags:
        - Transcripts
      summary: Request the transcript to be sent by email
      description: 'Triggers asynchronous generation of the PDF transcript, uploads
        it to S3, then sends an email containing a download link (presigned URL).
        Required role: STUDENT (for themselves only).

        '
      responses:
        '202':
          description: Request accepted, processing asynchronously
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptRequestAccepted'
      x-required-roles:
        - STUDENT
      security:
        - bearerAuth: []
  /students:
    get:
      tags:
        - Students
      summary: List students
      description: 'Required role: ADMIN'
      parameters:
        - $ref: '#/components/parameters/CohortIdFilter'
        - $ref: '#/components/parameters/GroupIdFilter'
        - $ref: '#/components/parameters/TrackIdFilter'
      responses:
        '200':
          description: List of students
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Student'
      x-required-roles:
        - ADMIN
      security:
        - bearerAuth: []
    post:
      tags:
        - Students
      summary: Create a student
      description: 'Required role: ADMIN'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentInput'
      responses:
        '201':
          description: Student created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
      x-required-roles:
        - ADMIN
      security:
        - bearerAuth: []
  /students/{studentId}:
    parameters:
      - $ref: '#/components/parameters/StudentId'
    get:
      tags:
        - Students
      summary: Get a student
      description: 'Required role: ADMIN, or TEACHER if the student is enrolled in
        one of their courses'
      responses:
        '200':
          description: Student details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
      x-required-roles:
        - ADMIN
        - TEACHER
      security:
        - bearerAuth: []
    put:
      tags:
        - Students
      summary: Update a student
      description: 'Required role: ADMIN'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentInput'
      responses:
        '200':
          description: Student updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
      x-required-roles:
        - ADMIN
      security:
        - bearerAuth: []
    delete:
      tags:
        - Students
      summary: Delete a student
      description: 'Required role: ADMIN'
      responses:
        '204':
          description: Student deleted
      x-required-roles:
        - ADMIN
      security:
        - bearerAuth: []
  /students/{studentId}/group:
    parameters:
      - $ref: '#/components/parameters/StudentId'
    put:
      tags:
        - Students
      summary: Change the student's group
      description: 'A student can change group at any time during their track. Required
        role: ADMIN.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - groupId
              properties:
                groupId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Group updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
      x-required-roles:
        - ADMIN
      security:
        - bearerAuth: []
  /students/{studentId}/grades:
    parameters:
      - $ref: '#/components/parameters/StudentId'
    get:
      tags:
        - Grades
      summary: View a student's grades
      description: 'Required role: ADMIN, or TEACHER for their own courses only'
      responses:
        '200':
          description: List of grades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Grade'
      x-required-roles:
        - ADMIN
        - TEACHER
      security:
        - bearerAuth: []
  /students/{studentId}/transcript:
    parameters:
      - $ref: '#/components/parameters/StudentId'
    post:
      tags:
        - Transcripts
      summary: Request a student's transcript to be sent by email
      description: 'Required role: ADMIN'
      responses:
        '202':
          description: Request accepted, processing asynchronously
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptRequestAccepted'
      x-required-roles:
        - ADMIN
      security:
        - bearerAuth: []
  /teachers:
    get:
      tags:
        - Teachers
      summary: List teachers
      description: 'Required role: ADMIN'
      responses:
        '200':
          description: List of teachers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Teacher'
      x-required-roles:
        - ADMIN
      security:
        - bearerAuth: []
    post:
      tags:
        - Teachers
      summary: Create a teacher
      description: 'Required role: ADMIN'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeacherInput'
      responses:
        '201':
          description: Teacher created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Teacher'
      x-required-roles:
        - ADMIN
      security:
        - bearerAuth: []
  /teachers/{teacherId}:
    parameters:
      - $ref: '#/components/parameters/TeacherId'
    get:
      tags:
        - Teachers
      summary: Get a teacher
      description: 'Required role: ADMIN'
      responses:
        '200':
          description: Teacher details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Teacher'
      x-required-roles:
        - ADMIN
      security:
        - bearerAuth: []
    put:
      tags:
        - Teachers
      summary: Update a teacher
      description: 'Required role: ADMIN'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeacherInput'
      responses:
        '200':
          description: Teacher updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Teacher'
      x-required-roles:
        - ADMIN
      security:
        - bearerAuth: []
    delete:
      tags:
        - Teachers
      summary: Delete a teacher
      description: 'Required role: ADMIN'
      responses:
        '204':
          description: Teacher deleted
      x-required-roles:
        - ADMIN
      security:
        - bearerAuth: []
  /teachers/me/courses:
    get:
      tags:
        - Teachers
      summary: List the current teacher's courses
      description: 'Required role: TEACHER'
      responses:
        '200':
          description: List of taught courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Course'
      x-required-roles:
        - TEACHER
      security:
        - bearerAuth: []
  /tracks:
    get:
      tags:
        - Tracks
      summary: List tracks
      description: 'Required role: ADMIN'
      responses:
        '200':
          description: List of tracks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Track'
      x-required-roles:
        - ADMIN
      security:
        - bearerAuth: []
    post:
      tags:
        - Tracks
      summary: Create a track
      description: 'Required role: ADMIN'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackInput'
      responses:
        '201':
          description: Track created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track'
      x-required-roles:
        - ADMIN
      security:
        - bearerAuth: []
  /tracks/{trackId}:
    parameters:
      - $ref: '#/components/parameters/TrackId'
    get:
      tags:
        - Tracks
      summary: Get a track
      description: 'Required role: ADMIN'
      responses:
        '200':
          description: Track details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track'
      x-required-roles:
        - ADMIN
      security:
        - bearerAuth: []
    put:
      tags:
        - Tracks
      summary: Update a track
      description: 'Required role: ADMIN'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackInput'
      responses:
        '200':
          description: Track updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track'
      x-required-roles:
        - ADMIN
      security:
        - bearerAuth: []
    delete:
      tags:
        - Tracks
      summary: Delete a track
      description: 'Required role: ADMIN'
      responses:
        '204':
          description: Track deleted
      x-required-roles:
        - ADMIN
      security:
        - bearerAuth: []
  /tracks/{trackId}/courses:
    parameters:
      - $ref: '#/components/parameters/TrackId'
    get:
      tags:
        - Tracks
      summary: List a track's courses, across all semesters
      description: 'Aggregate of the courses assigned to this track across all 6 of
        its semesters (dedicated + common core). For per-semester assignment, see
        PUT /tracks/{trackId}/semesters/{semesterId}/courses. Required role: ADMIN.

        '
      responses:
        '200':
          description: List of the track's courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Course'
      x-required-roles:
        - ADMIN
      security:
        - bearerAuth: []
  /tracks/{trackId}/semesters/{semesterId}/courses:
    parameters:
      - $ref: '#/components/parameters/TrackId'
      - $ref: '#/components/parameters/SemesterId'
    get:
      tags:
        - Tracks
      summary: List the courses assigned to this track for this semester
      description: 'Required role: ADMIN'
      responses:
        '200':
          description: List of assigned courses (total credits must equal 30)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Course'
      x-required-roles:
        - ADMIN
      security:
        - bearerAuth: []
    put:
      tags:
        - Tracks
      summary: Replace the list of courses assigned to this track for this semester
      description: 'Fully replaces the list of assigned courses (rather than an incremental
        add/remove), so that the sum of credits can be validated as exactly 30 in
        a single atomic operation. Required role: ADMIN.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseAssignmentInput'
      responses:
        '200':
          description: Assignment updated
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Course'
        '422':
          description: The sum of credits of the provided courses does not equal 30
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-required-roles:
        - ADMIN
      security:
        - bearerAuth: []
  /semesters:
    get:
      tags:
        - Semesters
      summary: List semesters (S1 to S6, global entity)
      description: 'Required role: ADMIN'
      responses:
        '200':
          description: List of semesters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Semester'
      x-required-roles:
        - ADMIN
      security:
        - bearerAuth: []
    post:
      tags:
        - Semesters
      summary: Create a semester
      description: 'Required role: ADMIN. A semester is a global entity (number from
        1 to 6), shared by all tracks.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SemesterInput'
      responses:
        '201':
          description: Semester created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Semester'
      x-required-roles:
        - ADMIN
      security:
        - bearerAuth: []
  /semesters/{semesterId}:
    parameters:
      - $ref: '#/components/parameters/SemesterId'
    get:
      tags:
        - Semesters
      summary: Get a semester
      description: 'Required role: ADMIN'
      responses:
        '200':
          description: Semester details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Semester'
      x-required-roles:
        - ADMIN
      security:
        - bearerAuth: []
    delete:
      tags:
        - Semesters
      summary: Delete a semester
      description: 'Required role: ADMIN'
      responses:
        '204':
          description: Semester deleted
      x-required-roles:
        - ADMIN
      security:
        - bearerAuth: []
  /semesters/{semesterId}/courses:
    parameters:
      - $ref: '#/components/parameters/SemesterId'
    get:
      tags:
        - Courses
      summary: List the courses assigned to this semester, across all tracks
      description: 'Read-only aggregate of every track/semester assignment for this
        semester number (useful for an admin-wide overview). For assignment, see PUT
        /tracks/{trackId}/semesters/{semesterId}/courses. Required role: ADMIN.

        '
      responses:
        '200':
          description: List of the semester's courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Course'
      x-required-roles:
        - ADMIN
      security:
        - bearerAuth: []
  /courses:
    get:
      tags:
        - Courses
      summary: List courses
      description: 'Required role: ADMIN'
      responses:
        '200':
          description: List of courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Course'
      x-required-roles:
        - ADMIN
      security:
        - bearerAuth: []
    post:
      tags:
        - Courses
      summary: Create a course
      description: 'Required role: ADMIN'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseInput'
      responses:
        '201':
          description: Course created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
      x-required-roles:
        - ADMIN
      security:
        - bearerAuth: []
  /courses/{courseId}:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      tags:
        - Courses
      summary: Get a course
      description: 'Required role: ADMIN, TEACHER (if assigned to the course)'
      responses:
        '200':
          description: Course details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
      x-required-roles:
        - ADMIN
        - TEACHER
      security:
        - bearerAuth: []
    put:
      tags:
        - Courses
      summary: Update a course
      description: 'Required role: ADMIN'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseInput'
      responses:
        '200':
          description: Course updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
      x-required-roles:
        - ADMIN
      security:
        - bearerAuth: []
    delete:
      tags:
        - Courses
      summary: Delete a course
      description: 'Required role: ADMIN'
      responses:
        '204':
          description: Course deleted
      x-required-roles:
        - ADMIN
      security:
        - bearerAuth: []
  /courses/{courseId}/teachers:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      tags:
        - Courses
      summary: List a course's teachers
      description: 'A course can be taught by several teachers. Required role: ADMIN'
      responses:
        '200':
          description: List of assigned teachers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Teacher'
      x-required-roles:
        - ADMIN
      security:
        - bearerAuth: []
    post:
      tags:
        - Courses
      summary: Assign a teacher to the course
      description: 'Required role: ADMIN'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - teacherId
              properties:
                teacherId:
                  type: string
                  format: uuid
      responses:
        '204':
          description: Teacher assigned
      x-required-roles:
        - ADMIN
      security:
        - bearerAuth: []
  /courses/{courseId}/teachers/{teacherId}:
    parameters:
      - $ref: '#/components/parameters/CourseId'
      - $ref: '#/components/parameters/TeacherId'
    delete:
      tags:
        - Courses
      summary: Remove a teacher from the course
      description: 'Required role: ADMIN'
      responses:
        '204':
          description: Teacher removed
      x-required-roles:
        - ADMIN
      security:
        - bearerAuth: []
  /courses/{courseId}/tracks:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      tags:
        - Courses
      summary: List the tracks a course is associated with
      description: 'List derived from existing assignments (see PUT /tracks/{trackId}/semesters/{semesterId}/courses):
        a dedicated course appears in a single track; a common core course appears
        in every track. Required role: ADMIN.

        '
      responses:
        '200':
          description: List of associated tracks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Track'
      x-required-roles:
        - ADMIN
      security:
        - bearerAuth: []
  /courses/{courseId}/exams:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      tags:
        - Exams
      summary: List a course's exams
      description: 'Required role: ADMIN, TEACHER (if assigned to the course)'
      responses:
        '200':
          description: List of exams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Exam'
      x-required-roles:
        - ADMIN
        - TEACHER
      security:
        - bearerAuth: []
    post:
      tags:
        - Exams
      summary: Create an exam for this course
      description: 'Required role: ADMIN, TEACHER (if assigned to the course)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExamInput'
      responses:
        '201':
          description: Exam created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exam'
      x-required-roles:
        - ADMIN
        - TEACHER
      security:
        - bearerAuth: []
  /courses/{courseId}/grades:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      tags:
        - Grades
      summary: List all grades for a course (across all exams)
      description: 'Required role: TEACHER (if assigned to the course), ADMIN'
      responses:
        '200':
          description: List of the course's grades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Grade'
      x-required-roles:
        - ADMIN
        - TEACHER
      security:
        - bearerAuth: []
  /exams/{examId}:
    parameters:
      - $ref: '#/components/parameters/ExamId'
    get:
      tags:
        - Exams
      summary: Get an exam
      description: 'Required role: ADMIN, TEACHER (if assigned to the course)'
      responses:
        '200':
          description: Exam details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exam'
      x-required-roles:
        - ADMIN
        - TEACHER
      security:
        - bearerAuth: []
    put:
      tags:
        - Exams
      summary: Update an exam (date, coefficient)
      description: 'Required role: ADMIN, TEACHER (if assigned to the course)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExamInput'
      responses:
        '200':
          description: Exam updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exam'
      x-required-roles:
        - ADMIN
        - TEACHER
      security:
        - bearerAuth: []
    delete:
      tags:
        - Exams
      summary: Delete an exam
      description: 'Required role: ADMIN'
      responses:
        '204':
          description: Exam deleted
      x-required-roles:
        - ADMIN
      security:
        - bearerAuth: []
  /exams/{examId}/grades:
    parameters:
      - $ref: '#/components/parameters/ExamId'
    get:
      tags:
        - Grades
      summary: List the grades obtained for this exam
      description: 'Required role: ADMIN, TEACHER (if assigned to the course)'
      responses:
        '200':
          description: List of the exam's grades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Grade'
      x-required-roles:
        - ADMIN
        - TEACHER
      security:
        - bearerAuth: []
  /groups:
    get:
      tags:
        - Groups
      summary: List groups
      description: 'Required role: ADMIN'
      parameters:
        - $ref: '#/components/parameters/CohortIdFilter'
        - $ref: '#/components/parameters/TrackIdFilter'
      responses:
        '200':
          description: List of groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
      x-required-roles:
        - ADMIN
      security:
        - bearerAuth: []
    post:
      tags:
        - Groups
      summary: Create a group
      description: 'Required role: ADMIN'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupInput'
      responses:
        '201':
          description: Group created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
      x-required-roles:
        - ADMIN
      security:
        - bearerAuth: []
  /groups/{groupId}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags:
        - Groups
      summary: Get a group
      description: 'Required role: ADMIN'
      responses:
        '200':
          description: Group details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
      x-required-roles:
        - ADMIN
      security:
        - bearerAuth: []
    put:
      tags:
        - Groups
      summary: Update a group
      description: 'Required role: ADMIN'
      requestBody:
