components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT returned by POST /login.
  parameters:
    StudentId:
      name: studentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TeacherId:
      name: teacherId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TrackId:
      name: trackId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SemesterId:
      name: semesterId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CourseId:
      name: courseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExamId:
      name: examId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GradeId:
      name: gradeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CohortId:
      name: cohortId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CohortIdFilter:
      name: cohortId
      in: query
      required: false
      schema:
        type: string
        format: uuid
    GroupIdFilter:
      name: groupId
      in: query
      required: false
      schema:
        type: string
        format: uuid
    TrackIdFilter:
      name: trackId
      in: query
      required: false
      schema:
        type: string
        format: uuid
  schemas:
    Role:
      type: string
      enum:
        - STUDENT
        - TEACHER
        - ADMIN
    Error:
      type: object
      properties:
        message:
          type: string
        code:
          type: string
    Student:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ref:
          type: string
          description: Student reference (e.g. STD24001)
          example: STD24001
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        groupId:
          type: string
          format: uuid
        trackId:
          type: string
          format: uuid
        cohortId:
          type: string
          format: uuid
    StudentInput:
      type: object
      required:
        - password
      properties:
        std:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        groupId:
          type: string
          format: uuid
    Teacher:
      type: object
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
    TeacherInput:
      type: object
      required:
        - password
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    Track:
      type: object
      description: 'A track has 3 years of 2 semesters each (6 semesters in total),
        for a mandatory total of 180 credits (30 per semester). A track has a list
        of courses: its dedicated courses, plus the common core courses shared with
        the other tracks.

        '
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        expectedTotalCredits:
          type: integer
          default: 180
          description: Total credits expected over the whole track (fixed business
            rule).
    TrackInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
    Semester:
      type: object
      description: 'A semester is a global entity (S1 to S6, shared by all tracks)
        and is not specific to a track. For a given track, the sum of credits of its
        courses (dedicated + common core) attached to this semester must equal 30.

        '
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
          minimum: 1
          maximum: 6
          example: 1
        year:
          type: integer
          minimum: 1
          maximum: 3
          description: 'Corresponding track year (computed: year = ceil(number / 2)).'
          example: 1
        expectedCredits:
          type: integer
          default: 30
          description: Number of credits expected per track for this semester (fixed
            business rule).
    SemesterInput:
      type: object
      required:
        - number
      properties:
        number:
          type: integer
          minimum: 1
          maximum: 6
          example: 1
    Course:
      type: object
      description: 'A course is created independently of any track or semester. Its
        association with one (or more) tracks for a given semester is done via PUT
        /tracks/{trackId}/semesters/{semesterId}/courses, which replaces the full
        list of assigned courses (atomic validation of the 30-credit total). A course
        associated with EVERY track for a given semester is a common core course.

        '
      properties:
        id:
          type: string
          format: uuid
        ref:
          type: string
          description: Course code / reference
          example: INFO301
        title:
          type: string
        credit:
          type: integer
          example: 5
    CourseInput:
      type: object
      required:
        - ref
        - title
        - credit
      properties:
        ref:
          type: string
          example: INFO301
        title:
          type: string
        credit:
          type: integer
          example: 5
    CourseAssignmentInput:
      type: object
      required:
        - courseIds
      description: 'Full list of courses assigned to a track for a given semester.
        Fully replaces the existing assignment (rather than an incremental add/remove),
        so the sum of credits can be validated as 30 in a single operation.

        '
      properties:
        courseIds:
          type: array
          items:
            type: string
            format: uuid
    Exam:
      type: object
      properties:
        id:
          type: string
          format: uuid
        courseId:
          type: string
          format: uuid
        date:
          type: string
          format: date
        coefficient:
          type: number
          format: float
          example: 1.5
    ExamInput:
      type: object
      required:
        - date
        - coefficient
      properties:
        date:
          type: string
          format: date
        coefficient:
          type: number
          format: float
          example: 1.5
    Group:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        cohortId:
          type: string
          format: uuid
        trackId:
          type: string
          format: uuid
    GroupInput:
      type: object
      required:
        - name
        - cohortId
        - trackId
      properties:
        name:
          type: string
        cohortId:
          type: string
          format: uuid
        trackId:
          type: string
          format: uuid
    Grade:
      type: object
      description: Grade obtained by a student for a given exam.
      properties:
        id:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
        examId:
          type: string
          format: uuid
        value:
          type: number
          format: double
        updatedAt:
          type: string
          format: date-time
    GradeInput:
      type: object
      required:
        - studentId
        - examId
        - value
      properties:
        studentId:
          type: string
          format: uuid
        examId:
          type: string
          format: uuid
        value:
          type: number
          format: float
          minimum: 0
          maximum: 20
    GradeUpdate:
      type: object
      required:
        - value
        - reason
      properties:
        value:
          type: number
          format: double
        reason:
          type: string
          description: Mandatory reason for the modification (dispute, error, etc.)
    GradeHistoryEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        previousValue:
          type: number
          format: float
        newValue:
          type: number
          format: float
        reason:
          type: string
        changedBy:
          type: string
          format: uuid
        changedAt:
          type: string
          format: date-time
    Cohort:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        startYear:
          type: integer
        endYear:
          type: integer
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
    CohortResults:
      type: object
      properties:
        cohortId:
          type: string
          format: uuid
        averageByYear:
          type: array
          items:
            type: object
            properties:
              year:
                type: integer
              average:
                type: number
                format: float
        graduatedCount:
          type: integer
        studentCount:
          type: integer
    GraduateEntry:
      type: object
      description: Row of a cohort's graduate list, sorted by rank.
      properties:
        rank:
          type: integer
          example: 1
        std:
          type: string
          description: Student reference
          example: STD2024001
        lastName:
          type: string
        firstName:
          type: string
        average:
          type: number
          format: float
          description: Student's overall average
    TranscriptRequestAccepted:
      type: object
      properties:
        message:
          type: string
          example: The transcript will be sent by email shortly.
    StudentUpdateInput:
      type: object
      properties:
        std:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        groupId:
          type: string
          format: uuid
    TeacherUpdateInput:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      properties:
        token:
          type: string
