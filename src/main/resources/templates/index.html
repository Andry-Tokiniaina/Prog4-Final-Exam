<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8"/>
    <title>Promotions - Diplômés</title>
</head>
<body>
    <h1>Promotions</h1>

    <ul>
        <li th:each="cohort : ${cohorts}">
            <span th:text="${cohort.name}">Promotion</span>
            <a th:href="@{/cohorts/{id}/graduates/export(id=${cohort.id})}">
                Télécharger les diplômés (Excel)
            </a>
        </li>
    </ul>
</body>
</html>
